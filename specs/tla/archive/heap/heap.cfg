\* tlc: spec=heap.tla
\* heap.tla, real S3 design: first-session permanent object, no restart path (AU_BLE_PAUSE 0).
\* Unbounded job sequence (MaxJobs = 0), one reboot at any point.
SPECIFICATION Spec
CONSTANTS
  FirstPerm = TRUE
  K = 1
  MaxJobs = 0
  MaxReboots = 1
  EnvChurn = TRUE
  Restart = FALSE
  BugLeakAt = "none"
  BugPermEvery = FALSE
  BugPermCycle = FALSE
  BugNoRestore = FALSE
  BugStackLeak = FALSE
  BugTwoStep = FALSE
  BugRebootKeep = FALSE
INVARIANTS TypeOK H1 H2 H4Bound H6Idle
PROPERTIES H3 H4Stable H6Step H7 H8
