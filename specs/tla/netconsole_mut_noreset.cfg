  MaxConn = 3
  NF = 3
  Reuse = TRUE
  MaxStops = 1
  HasDeadline = TRUE
  AcceptAnyTime = FALSE
  Takeover = TRUE
  MarkGuard = FALSE
  BugNoFdCheck = FALSE
  BugFlagSurvive = FALSE
  BugNoReset = TRUE
  BugNoClose = FALSE
  BugStaleFd = FALSE
  BugPreemptActive = FALSE
INVARIANTS
  NoUnauthCmd
