\* tlc: spec=netconsole.tla
\* tlc: expect-fail=NoForeignShut
\* tlc: nodeadlock
\* FINDING FORMAL-NETCON-MARK, confirmed by TLC on 2026-11-26 and fixed the same day (#1339): before the fix after the stale mark of netconsole_was_kickmarked, a holder that
\* closed its fd but has not yet freed the slot (serial print in between) is preempted; accept() already reused the
\* fd number, so shutdown() hits the NEW connection.
SPECIFICATION Spec
CONSTANTS
  MaxConn = 3
  NF = 3
  Reuse = TRUE
  MaxStops = 1
  HasDeadline = TRUE
  AcceptAnyTime = FALSE
  Takeover = TRUE
  MarkGuard = FALSE
  BugNoFdCheck = FALSE
  BugFlagSurvive = FALSE
  BugNoReset = FALSE
  BugNoClose = FALSE
  BugStaleFd = FALSE
  BugPreemptActive = FALSE
INVARIANTS
  NoForeignShut
