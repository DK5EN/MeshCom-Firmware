  MaxConn = 3
  NF = 2
  Reuse = TRUE
  MaxStops = 1
  HasDeadline = TRUE
  AcceptAnyTime = TRUE
  BugNoFdCheck = FALSE
  BugFlagSurvive = FALSE
  BugNoReset = FALSE
  BugNoClose = FALSE
  BugStaleFd = FALSE
INVARIANTS NoWrongTear
