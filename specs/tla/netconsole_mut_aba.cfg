\* tlc: spec=netconsole.tla
\* tlc: expect-fail
\* tlc: nodeadlock
\* sensitivity: accept does not run on the reader's thread; lwIP reuses the fd number and teardownIfCurrent's s_fd == fd check passes for a different session (ABA). Today accept and the reader are both loop-task code, so this does not happen
