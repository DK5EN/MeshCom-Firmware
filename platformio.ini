	-DCONFIG_BT_NIMBLE_MAX_BONDS=1
	-DCONFIG_BT_NIMBLE_MAX_CCCDS=2
	-DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
	-DCONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED
	-DCONFIG_BT_NIMBLE_HOST_TASK_STACK_SIZE=3072
	-DCONFIG_BT_NIMBLE_MSYS1_BLOCK_COUNT=4
	-std=c++17
	-std=gnu++17
; -Werror nur fuer src/ (build_src_flags), nicht fuer build_flags: die
; Drittanbieter-Libraries unter .pio/libdeps warnen (TinyGPSPlus, BMx280MI,
; OneWire) und duerfen den Build nicht brechen. -Wformat=2 haette die
; SEC-02-Fundstelle (nicht-literaler Format-String in printfdeb) sofort gemeldet.
; -Wmissing-field-initializers (aus -Wextra) trifft die idiomatische
; ESP-IDF-Struktur-Initialisierung, z.B. i2s_driver_config_t in
; src/esp32/esp32_audio.cpp: die restlichen Felder sind IDF-versionsabhaengig und
; bewusst 0. Sie auszuschreiben waere Bruch bei jedem IDF-Update, nicht mehr
; Sicherheit -- deshalb gezielt nur diese Teilwarnung aus, statt -Werror zu opfern.
build_src_flags =
	-Wall -Wextra
	-Wformat=2
	-Wno-missing-field-initializers
	-Werror
board_build.partitions = partitions-4MB-safeboot.csv
board_build.app_partition_name = app
; upload_protocol esptool statt custom: bei "custom" ruft der espressif32-Builder
; keine Port-Erkennung auf, $UPLOAD_PORT im upload_command bleibt dann ohne
; upload_port/--upload-port leer und esptool bricht ab. Bei "esptool" laeuft
; vorher AutodetectUploadPort (bzw. der manuell angegebene Port wird genommen);
; PlatformIO-Core ersetzt UPLOADCMD danach unabhaengig vom Protokoll durch
; upload_command, unser esptool-Aufruf bleibt also der Upload-Befehl.
upload_protocol = esptool

