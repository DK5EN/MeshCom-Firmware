	${env:t_deck_pro.build_flags}
	-D EXTERNAL_RADIO=1

[env:native_command_toggles]
; D2-06 -- toggleApply() (src/command_toggles.h), the dispatcher that replaced
; 70 of the ladder's on/off rungs. Same reason as native_command_match: the code
; it stands in for lived in command_functions.cpp, which no native env compiles,
; so none of those 70 rungs was ever executed by a test. The cases here are the
; ones that actually differ between rows -- 32-bit and/or masks, a flag set
; while its bit is cleared, post() before vs after the mask, bReturn vs return.
platform = native
test_framework = unity
test_filter = test_command_toggles
build_flags =
	-std=gnu++17
	-D NATIVE_BUILD=1
	-D UNIT_TEST=1
	-I src
	-Wall
	-Wextra
test_build_src = no

[env:native_command_setters]
; D2-07 -- the numeric-argument helpers (src/command_setters.h) shared by the
; ladder's ~54 value setters. Same reason as native_command_match and
; native_command_toggles: this arithmetic lived in command_functions.cpp, which
; no native env compiles, so the parse/range/store logic behind every --set<X>
; had no executable test. The cases pin the behaviour on a NON-NUMERIC argument,
; which used to read an uninitialised temporary (--txpower abc reported
