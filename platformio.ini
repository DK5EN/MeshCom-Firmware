; Frueher stand dieser Block als eigene, gleichnamige "nrf52"-Section in
; jeder der drei nRF52-Variantendateien (wiscore_rak4631, heltec_t114,
; t_echo). PlatformIO mergt gleichnamige Sections ueber alle extra_configs
; hinweg, wodurch die
; drei Kopien im Glob-Reihenfolge-Zufall zu einer einzigen wurden -- ein
; stiller Kollisionsfehler (CFG-01). Hier ist das Teilen jetzt explizit und
; unabhaengig von der Glob-Reihenfolge.
;
; -D BOARD_RAK4630 und der Quellfilter +<../variants/wiscore_rak4631/*>
; werden von heltec_t114 und t_echo ABSICHTLICH mitgeerbt (das war auch
; vorher schon der faktische Effekt des Merges): BOARD_RAK4630 schaltet ueber
; 60 nRF52-Codestellen frei, und t_echo kompiliert dadurch wiscore_rak4631s
; variant.cpp statt der eigenen (die einen bislang nie gebauten
; PIN_LED3-Init enthaelt). Das zu aendern braucht Hardware-Verifikation auf
; diesen Boards, nicht nur eine Config-Aufraeumung.
[nrf52_base]
platform = nordicnrf52@10.12.0
framework = arduino
extends = upload_settings
build_src_filter =
	+<*>
	-<esp32/*>
	-<Displays/*>
	-<Fonts/*>
	-<GFX_Root/*>
	-<Platforms/*>
	-<safeboot/*>
	-<t-deck/*>
	-<t-deck-pro/*>
	-<t5-epaper/*>
	-<tinyxml_function.cpp>
	+<../variants/wiscore_rak4631/*>
build_flags =
	${common.build_flags}
	-D BOARD_RAK4630="RAK4630"
	-D MONITOR_SPEED=${upload_settings.monitor_speed}
	-D SERIAL_BUFFER_SIZE=250
	-Isrc/nrf52
; -Wall -Wextra nur fuer src/ (build_src_flags), nicht fuer build_flags: in
; build_flags treffen sie auch den Adafruit-nRF52-Core und die SoftDevice-Header
; (nrf_soc.h, ble_gap.h ... -- SVCALL-Prototypen ohne Parameternamen) und
; erzeugen dort ueber 23.000 -Wunused-parameter-Warnungen pro Vollbuild, die
; jede echte Warnung im Log begraben. Der Fremdcode ist nicht unser Code.
build_src_flags =
	-Wformat=2
	-Wno-unused-parameter
	-Werror

[common]
build_flags = 
	-DRADIOLIB_EXCLUDE_CC1101=1
	-DRADIOLIB_EXCLUDE_NRF24=1
	-DRADIOLIB_EXCLUDE_RF69=1
	-DRADIOLIB_EXCLUDE_SX1231=1
	-DRADIOLIB_EXCLUDE_SX1233=1
	-DRADIOLIB_EXCLUDE_SI443X=1
	-DRADIOLIB_EXCLUDE_RFM2X=1
	-DRADIOLIB_EXCLUDE_AFSK=1
	-DRADIOLIB_EXCLUDE_HELLSCHREIBER=1
	-DRADIOLIB_EXCLUDE_MORSE=1
	-DRADIOLIB_EXCLUDE_RTTY=1
	-DRADIOLIB_EXCLUDE_SSTV=1
	-DRADIOLIB_EXCLUDE_AX25=1
	-DRADIOLIB_EXCLUDE_DIRECT_RECEIVE=1
	-DRADIOLIB_EXCLUDE_BELL=1
	-DRADIOLIB_EXCLUDE_PAGER=1
	-DRADIOLIB_EXCLUDE_FSK4=1
	-DRADIOLIB_EXCLUDE_APRS=1
	-DRADIOLIB_EXCLUDE_LORAWAN=1
	-DRADIOLIB_EXCLUDE_ADSB=1
	-DRADIOLIB_EXCLUDE_AFSK=1
	-DRADIOLIB_EXCLUDE_LLCC68=1
	-DRADIOLIB_EXCLUDE_LR11X0=1
	-DRADIOLIB_EXCLUDE_LR2021=1
	-DRADIOLIB_EXCLUDE_RFM2X=1
	-DRADIOLIB_EXCLUDE_SX128X=1
	;-DRADIOLIB_DEBUG_BASIC=1
	;-DDO_DEBUG=1

	-Wl,--print-memory-usage

[upload_settings]
monitor_speed = 115200

; Nativer Testbuild — laeuft auf dem Entwicklungsrechner, nicht auf Hardware.
;
;   pio test -e native
;
; Bewusst NICHT in default_envs: `pio run` soll weiterhin nur Firmware bauen.
;
; build_src_filter listet genau die Uebersetzungseinheiten auf, die nativ
; uebersetzbar sind. Die Liste waechst, wenn Nahtstellen entstehen — sie ist
; die ehrliche Antwort auf die Frage, wieviel dieses Projekts heute ohne
; Hardware pruefbar ist.
;
; test/support/ liefert Arduino.h, configuration.h und debugconf.h als Ersatz.
; Das Board-Profil ist dort explizit gepinnt (siehe Kommentar in der Datei) —
; ohne das waehlt configuration_global.h Ringgroessen, die es auf keinem Board
; gibt.
[env:native]
platform = native
test_framework = unity
; Nur unsere eigenen Host-Tests. Upstream legt weitere Suiten unter test/ ab
; (test_compress, test_external_radio_*), die eigene Libs/Flags brauchen und
; unter dieser Env nicht linken -- sie laufen in env:native_extradio.
test_filter =
	test_regex_call
	test_millis_rollover
	test_ack_validate
	test_ack_replay
	test_ack_phone_frame
	test_printfdeb_format
	test_mask_secret
	test_ble_json_frame
	test_settings_sanitize
	test_ntp_async
	test_ntp_harvest
	test_charset_filter
	test_beacon_rate
	test_maxhop
	test_backpressure
	test_bp_echo_guard
	test_extern_notice_json
	test_extern_tele_json
	test_mcp17_bits
	test_setlog_lines
	test_gps_filter
	test_alt_fusion
	test_kbd_repeat
	test_radio_units
	test_msgid_counter
; ArduinoJson ist header-only und laeuft nativ; gebraucht von test_ble_json_frame.
lib_deps =
	bblanchon/ArduinoJson@^7.4.3
build_flags =
	-std=gnu++17
	-D NATIVE_BUILD=1
	-D UNIT_TEST=1
	-I test/support
	-I src
	-Wall
	-Wextra
test_build_src = yes
build_src_filter =
	-<*>
	+<Regexp.cpp>
	+<regex_functions.cpp>
	+<settings_sanitize.cpp>
	+<ntp_async.cpp>
	+<charset_filter.cpp>
	+<setlog_lines.cpp>
	+<gps_filter.cpp>
	+<alt_fusion.cpp>
	+<radio_units.cpp>
	+<msgid_counter.cpp>

; Test-Orakel (doc 08 §4): decodeAPRS()/encodeAPRS() nativ, mit on-air
; mitgeschnittenen Fremd-Frames als Interop-Vektoren. Eigene Env, damit die
; bestehenden native-Tests nicht die aprs-Link-Stubs mitschleppen muessen.
[env:native_aprs]
platform = native
test_framework = unity
test_filter =
	test_aprs_decode
	test_aprs_corpus
	test_aprs_spec
	test_aprs_epilogue
	test_hey_report
	test_txring
	test_txring_flood
	test_gwflood_frames
	test_txprio_replay
	test_unconfigured
	test_bp_notice_frame
	test_bp_regression
build_flags =
	-std=gnu++17
	-D NATIVE_BUILD=1
	-D UNIT_TEST=1
	-I test/support
	-I src
	-Wall
	-Wextra
test_build_src = yes
build_src_filter =
	-<*>
	+<Regexp.cpp>
	+<regex_functions.cpp>
	+<aprs_functions.cpp>
	+<charset_filter.cpp>
	+<txring_functions.cpp>

; PT-01 (BACKLOG §3.8j): Protokoll-Parser ohne Test. Drei Envs, damit jeder
; Parser nur seine eigenen Stubs mitschleppt (test/<suite>/stubs, per -I).
[env:native_parsers]
platform = native
test_framework = unity
; chain+ evaluates the #ifndef NATIVE_BUILD guards; plain chain text-scans the
; T-Deck includes in mheard_functions.cpp and drags lib/lvgl into the build.
lib_ldf_mode = chain+
test_filter =
	test_decodeaprspos
	test_decodemheard
	test_mheard_aging
	test_mheard_render
	test_checkvia
	test_pos_tag_nan
lib_deps =
	bblanchon/ArduinoJson@^7.4.3
build_flags =
	-std=gnu++17
	-D NATIVE_BUILD=1
	-D UNIT_TEST=1
	-I test/test_decodemheard/stubs
	-I test/support
	-I src
	-Wall
	-Wextra
test_build_src = yes
build_src_filter =
	-<*>
	+<Regexp.cpp>
	+<regex_functions.cpp>
	+<aprs_functions.cpp>
	+<charset_filter.cpp>
	+<mheard_functions.cpp>
	+<via_functions.cpp>

; BAT-01: reiner No-Battery-Detection-Kern, nativ testbar (ASan/UBSan wie
; native_dedup, USE_NEW_BATT damit batt_functions.cpp ueberhaupt kompiliert).
[env:native_batt_detect]
platform = native
test_framework = unity
test_filter =
	test_batt_detect
build_flags =
	-std=gnu++17
	-D NATIVE_BUILD=1
	-D UNIT_TEST=1
	-D USE_NEW_BATT=1
	-I test/support
	-I src
	-Wall
	-Wextra
	-g
	-fsanitize=address,undefined
	-fno-omit-frame-pointer
build_type = debug
test_build_src = yes
build_src_filter =
	-<*>
	+<batt_functions.cpp>

; TM-39: reiner CONF-Frame-Parser (Server-Provisionierung), eigene Env weil
