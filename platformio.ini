	-D EXTERNAL_RADIO=1
	-std=c++17

; --- Opt-in ESP32 external-radio firmware build (NOT in default_envs) ---
; Builds the full firmware with the EXTERNAL_RADIO TCP transport enabled. Extends
; a known-good ESP32 board env and only adds the compile flag, so default builds
; are untouched. Bridge host/port (and an optional password) are supplied at
; build time by an external, untracked overlay (e.g. -D EXTERNAL_RADIO_HOST=...);
; both host and port are required — a missing value is a compile error.
