	-I test/support
	-I src
	-Wall
	-Wextra
test_build_src = yes
build_src_filter =
	-<*>
	+<conf_frame.cpp>

[env:native_extern]
platform = native
test_framework = unity
test_filter =
	test_getextern
lib_deps =
	bblanchon/ArduinoJson@^7.4.3
build_flags =
	-std=gnu++17
	-D NATIVE_BUILD=1
	-D UNIT_TEST=1
	-I test/test_getextern/stubs
	-I test/support
	-I src
	-Wall
	-Wextra
test_build_src = yes
build_src_filter =
	-<*>
	+<Regexp.cpp>
	+<regex_functions.cpp>
	+<aprs_functions.cpp>
	+<charset_filter.cpp>
	+<extudp_functions.cpp>

; U6 twin (test plan section 4.4): countryProfile() built twice, once per
; variant macro set. The two sides must NOT agree -- the values are in
; different units (OPT-D14) -- so each env compares against its own committed
; baseline under test/golden/native/.
[env:native_country_esp32]
platform = native
test_framework = unity
test_filter = test_country_twin
build_flags =
	-std=gnu++17
	-D NATIVE_BUILD=1
	-D UNIT_TEST=1
	-I test/test_country_twin/stubs_esp32
	-I src
	-Wall
	-Wextra
test_build_src = yes
build_src_filter =
	-<*>
	+<country_profile.cpp>

[env:native_country_nrf52]
platform = native
test_framework = unity
test_filter = test_country_twin
build_flags =
	-std=gnu++17
	-D NATIVE_BUILD=1
	-D UNIT_TEST=1
	-D BOARD_RAK4630=1
	-I test/test_country_twin/stubs_nrf52
	-I src
	-Wall
	-Wextra
test_build_src = yes
build_src_filter =
	-<*>
	+<country_profile.cpp>

; U2 twin (test plan 4.4): ONE binary, both drain translation units. The two
; drains are named differently (sendMeshComUDP / sendUDP), so they link
; together and share one ringBufferUDPout -- the comparison is a real
; differential in one process, not two runs compared through files.
;
; The stub include dir shadows udp_functions.h and nrf_eth.h (which reach the
; WiFi/DNS and W5100S surfaces) plus three empty shims for headers the drain
; inherited from its origin TU but uses nothing from. Every declaration the two
; real shadows copy is checked verbatim against its header by
; test/golden/twin_stub_lint.py (run from selftest.sh).
[env:native_udp_send_twin]
platform = native
test_framework = unity
test_filter = test_udp_send_twin
build_flags =
	-std=gnu++17
	-D NATIVE_BUILD=1
	-D UNIT_TEST=1
	-I test/test_udp_send_twin/stubs
	-I test/support
	-I src
	-Wall
	-Wextra
test_build_src = yes
build_src_filter =
	-<*>
	+<Regexp.cpp>
	+<regex_functions.cpp>
	+<aprs_functions.cpp>
	+<charset_filter.cpp>
	+<esp32/udp_drain_esp32.cpp>
	+<nrf52/udp_drain_nrf52.cpp>

; U1 twin (test plan 4.3): ONE binary, both frame-handler TUs. The two
; handlers are named differently (handleUdpFrame_esp32 / handleUdpFrame_nrf52),
; so they link together and can be fed the same datagram -- same arrangement as
; native_udp_send_twin.
;
; Eleven of the symbols the handlers call are REAL here, not stubs: the APRS
; codec, the regex/via/dedup/conf/setlog/txring parsers all compile natively
; and are listed below. What the test stubs is the sinks (display, BLE, flash,
; EXTUDP, ack).
; W3 acceptance criterion: "reordering the struct's members changes nothing
; observable". The real s_meshcom_settings does not compile on a host, so the
; property is asserted where it actually lives -- two structs with the same
; members in different declaration order, sharing key/type but each with its
; own offsetof table. Only settings_store.cpp is compiled in; the suite must
; not reach for settings_schema or any platform header.
; W3 wave D: the four nRF52 load/save paths, EXECUTED rather than only compiled.
; Builds the real nrf52_flash.cpp and settings_store_nrf52.cpp on the host
; against an in-memory filesystem, so the keyed fast path, the sanity-gate
; rejection, the legacy->keyed migration and the retired-0x57 reset each
; actually run. Bench hardware remains the final proof; this is what makes a
; regression in any of them fail before it reaches a device.
;
; -include is load-bearing, not a convenience. Both source files under test do
; `#include "WisBlock-API.h"` -- quoted and unprefixed -- and both live in
; src/nrf52/ alongside the real header, so a quoted include resolves against
; the including file's own directory before any -I is consulted and no -I
; ordering can shadow it. The stub therefore predefines the real header's own
; guard macro and is force-included ahead of everything, which makes the real
; body a no-op when its include is reached. twin_stub_lint.py pairs that stub
; against the real header: it carries a full copy of s_meshcom_settings, and
; settings_schema.cpp takes offsetof() against whichever definition it sees,
; so member-order or type drift there would leave the suite green while
; testing a layout no device has.
;
; -Wno-missing-braces so the copied `node_mcp17t[16][16] = {0}` line can stay
; byte-identical to the real header instead of diverging to silence a warning.
; TX_POWER_MIN/MAX are the RAK4631 values: nrf52_flash.cpp has no fallback
; #define and normally gets them via lora_setchip.h -> configuration.h, which
; this suite stubs out.
[env:native_nrf52_settings_paths]
platform = native
test_framework = unity
test_filter = test_nrf52_settings_paths
build_flags =
	-std=gnu++17
	-D NATIVE_BUILD=1
	-D NRF52_SERIES
	-D TX_POWER_MIN=2
	-D TX_POWER_MAX=22
	-I src
	-I test/test_nrf52_settings_paths/stubs
	-I test/support
	-Wall
	-Wextra
	-Wno-missing-braces
; The force-include is applied by an extra_script, not by a build flag:
; build_flags AND build_src_flags both reach C translation units (Unity's
; unity.c among them), and force-feeding a C++ header into a .c file dies at
; <cstdarg>. CXXFLAGS is the only C++-only place. See the script's docstring.
extra_scripts =
	pre:tools/force_include_settings_stub.py
test_build_src = yes
build_src_filter =
	-<*>
	+<nrf52/nrf52_flash.cpp>
	+<nrf52/settings_store_nrf52.cpp>
	+<nrf52/ble_settings_v1.cpp>
	+<settings_store.cpp>
	+<settings_schema.cpp>
	+<settings_sanitize.cpp>
	+<msgid_counter.cpp>

; The frozen nRF52 BLE settings v1 wire format (src/nrf52/ble_settings_v1.h/
; .cpp) -- byte-for-byte conversion between s_meshcom_settings and the wire
; image the phone app already understands, so a later reorder of
; s_meshcom_settings cannot silently corrupt every app's saved
; configuration. -D TX_POWER_MIN/MAX: config_json.h's CFG_FIELD_LIST row for
; node_power references them (same values native_nrf52_settings_paths uses
; for the same struct). The stub + force-include follow
; native_nrf52_settings_paths's own pattern exactly (see this env's stub's
; own top comment for why it needs its own copy rather than reusing that
; one) -- ble_settings_v1.cpp/.h's quoted `#include "WisBlock-API.h"` is a
; same-directory (src/nrf52/) search no -I path can shadow.
[env:native_ble_settings_v1]
platform = native
test_framework = unity
test_filter = test_ble_settings_v1
build_flags =
	-std=gnu++17
	-D NATIVE_BUILD=1
	-D NRF52_SERIES
	-D TX_POWER_MIN=2
	-D TX_POWER_MAX=22
	-I src
	-I test/test_ble_settings_v1/stubs
	-I test/support
	-Wall
	-Wextra
	-Wno-missing-braces
extra_scripts =
	pre:test/test_ble_settings_v1/force_include_stub.py
test_build_src = yes
build_src_filter =
	-<*>
	+<nrf52/ble_settings_v1.cpp>

[env:native_settings_roundtrip]
platform = native
test_framework = unity
test_filter = test_settings_roundtrip
build_flags =
	-std=gnu++17
	-D NATIVE_BUILD=1
	-D UNIT_TEST=1
	-I src
	-Wall
	-Wextra
; test_build_src is what actually pulls src/ into the link -- without it
; build_src_filter selects from a source set that is never compiled for a
; test env, and the suite fails at link with undefined settings_store symbols.
test_build_src = yes
build_src_filter =
	-<*>
	+<settings_store.cpp>

[env:native_settings_members_esp32]
; W3 step 3: member-level fail-closed gate -- every s_meshcom_settings member is
; either a settings_schema row or named in meshcom_settings_runtime.h. ESP32 +
; T-Deck configuration (the widest struct). Sibling env below runs the nRF52 view.
platform = native
test_framework = unity
test_filter = test_settings_members
build_flags =
	-std=gnu++17
	-D NATIVE_BUILD=1
	-D UNIT_TEST=1
	-D ESP32
	-D BOARD_T_DECK=1
	-D TX_POWER_MIN=-9
	-D TX_POWER_MAX=22
	-D MAX_HOP_TEXT_DEFAULT=4
	-I test/test_settings_members/stubs
	-I test/support
	-I src
	-Wall
	-Wextra
test_build_src = yes
build_src_filter =
	-<*>
	+<settings_store.cpp>
	+<settings_schema.cpp>

[env:native_settings_members_nrf52]
platform = native
test_framework = unity
test_filter = test_settings_members
build_flags =
	-std=gnu++17
	-D NATIVE_BUILD=1
	-D UNIT_TEST=1
	-D NRF52_SERIES
	-D TX_POWER_MIN=2
	-D TX_POWER_MAX=22
	-D MAX_HOP_TEXT_DEFAULT=4
	-I test/test_settings_members/stubs
	-I test/support
	-I src
	-Wall
	-Wextra
test_build_src = yes
build_src_filter =
	-<*>
	+<settings_store.cpp>
	+<settings_schema.cpp>

[env:native_command_match]
; D2-10 -- the command ladder's matching rule (src/command_match.h), carved out
; of command_functions.cpp so it can be tested at all. That file pulls in
; Arduino, LVGL and the radio stack, so no native env compiles it, and the rule
; every one of the ~309 command rungs depends on had no executable test: the
; only guards were the ordering lint and a hardware capture. Header-only, so
; there is nothing to add to build_src_filter.
platform = native
test_framework = unity
test_filter = test_command_match
build_flags =
	-std=gnu++17
	-D NATIVE_BUILD=1
	-D UNIT_TEST=1
	-I src
	-Wall
	-Wextra
test_build_src = no

[env:native_settings_store]
; W3 step 1 -- the keyed settings store (D1-04 target architecture), built and
; tested on the host BEFORE either platform is wired to it. The whole point of
; landing it this way round: this is the wave where a mistake costs every node
; in the fleet its settings, so the encoder/decoder earns its tests while it
; still cannot touch a real device.
; Unused code here costs ~0 flash in firmware images: ESP32 links with
; -Wl,--gc-sections (platform _bare.py:65) against -ffunction-sections.
platform = native
test_framework = unity
test_filter = test_settings_store
build_flags =
	-std=gnu++17
	-D NATIVE_BUILD=1
	-D UNIT_TEST=1
	-I test/test_settings_store/stubs
	-I test/support
	-I src
	-Wall
	-Wextra
test_build_src = yes
build_src_filter =
	-<*>
	+<settings_store.cpp>

; D1-04 W3 Task 1/2 -- the ESP32 NVS settings backend, built and RUN against
; a fake in-memory Preferences (stubs/Preferences.h) for the first time:
; there was no ESP32-side settings test before this suite. Builds the REAL
; src/esp32/esp32_flash.cpp + src/settings_schema.cpp + src/settings_store.cpp
; against this env's own struct/board configuration.
;
; -D MC_SAFEBOOT: takes esp32_flash.cpp's `#if !defined(MC_SAFEBOOT)` radio-
; sanitize/msgid-advance/auto-save path (sanitize_loaded_settings()) out of
; this suite's scope -- it pulls in settings_sanitize.h/msgid_counter.h/
; lora_setchip.h's full board-configuration chain, none of which the generic
; FieldDescriptor <-> Preferences walk under test needs. max_hop_text is
; still exercised: it loads via its own explicit line in init_flash()
; regardless of MC_SAFEBOOT. node_msgid is no longer a settings row at all --
; it lives in the "Counters" namespace behind counters_store.h, which is
; compiled out under MC_SAFEBOOT (see test_esp32_settings_nvs.cpp's own top
; comment); native_esp32_flash_lifecycle covers it.
; -D BOARD_T_DECK=1: compiles in the T-Deck-only struct members and their
; SETTINGS_PERSIST_ONLY_LIST_PLATFORM rows (node_audio_start/msg, node_mute,
; ...) so this suite can exercise them, including the D1-04 W3 Task 2 char[]
; conversion.
; -fsanitize=address,undefined: the audio-field truncation test
; (test_audio_fields_roundtrip_and_truncate_safely) exists specifically to
; prove a bounded write where an unbounded one would overflow a 128-byte
; buffer -- ASan turns "silently wrong length" into "the test run aborts"
; for that class of bug, same reasoning as native_dedup's own ASan build.
[env:native_esp32_settings_nvs]
platform = native
test_framework = unity
test_filter = test_esp32_settings_nvs
build_flags =
	-std=gnu++17
	-D NATIVE_BUILD=1
	-D UNIT_TEST=1
	-D ESP32
	-D MC_SAFEBOOT
	-D BOARD_T_DECK=1
	-D UNITY_INCLUDE_DOUBLE
	-I test/test_esp32_settings_nvs/stubs
	-I test/support
	-I src
	-Wall
	-Wextra
	-g
	-fsanitize=address,undefined
	-fno-omit-frame-pointer
build_type = debug
test_build_src = yes
build_src_filter =
	-<*>
	+<esp32/esp32_flash.cpp>
	+<settings_store.cpp>
	+<settings_schema.cpp>

; D1-04 W3: the ESP32 flash-lifecycle regression suite. Same target file as
; native_esp32_settings_nvs above, built WITHOUT -D MC_SAFEBOOT on purpose --
; sanitize_loaded_settings() (the code path the historical
; save_settings()-called-from-inside-sanitize defect lived in) is compiled
; OUT of esp32_flash.cpp under MC_SAFEBOOT, so that suite cannot see it.
; settings_sanitize.cpp/msgid_counter.cpp are pulled in for real (both
; Arduino-free by design, see their own header comments); lora_setchip.h is
; stubbed to just `max_country` (test/test_esp32_flash_lifecycle/stubs), same
; narrowing native_nrf52_settings_paths already applies to the identical
; header on the nRF52 sanitize path. TX_POWER_MIN/MAX supplied as build flags
; for the same reason native_nrf52_settings_paths supplies them: the real
; values live in a board configuration.h this build deliberately never pulls
; in.
[env:native_esp32_flash_lifecycle]
platform = native
test_framework = unity
test_filter = test_esp32_flash_lifecycle
build_flags =
	-std=gnu++17
	-D NATIVE_BUILD=1
	-D UNIT_TEST=1
	-D ESP32
	-D BOARD_T_DECK=1
	-D TX_POWER_MIN=-9
	-D TX_POWER_MAX=22
	-D MAX_HOP_TEXT_DEFAULT=4
	-D UNITY_INCLUDE_DOUBLE
	-I test/test_esp32_flash_lifecycle/stubs
	-I test/support
	-I src
	-Wall
	-Wextra
	-g
	-fsanitize=address,undefined
	-fno-omit-frame-pointer
build_type = debug
test_build_src = yes
build_src_filter =
	-<*>
	+<esp32/esp32_flash.cpp>
	+<settings_store.cpp>
	+<settings_schema.cpp>
	+<settings_sanitize.cpp>
	+<msgid_counter.cpp>

