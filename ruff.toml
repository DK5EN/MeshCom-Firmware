# Python lint gate for tools/ and test/. This file is the single source of the
# rule set: tools/regression.sh stage 2 ("ruff lint gate") runs plain
# `ruff check` without --select, so a rule added here reaches the gate.
#
# Scope: correctness, not style. Formatting and style rules (UP, I, B, a
# `ruff format --check` gate) would rewrite most of tools/ and stay out until
# the operator decides on a style gate.
#
#   E9    syntax errors / IO errors while parsing
#   F     pyflakes: undefined names, invalid comparisons, misplaced
#         statements, unused imports and variables, f-strings without
#         placeholders, star imports
#   E722  bare `except:`
#
# Run: uv run --quiet --with ruff==0.17.0 ruff check tools test
# Bump the pin in tools/regression.sh and here together; a newer ruff can add
# syntax checks and turn the gate red without a code change.

target-version = "py311"
line-length = 100
extend-exclude = [".pio", "node_modules", "lib", "docs", "extras"]

[lint]
select = ["E9", "F", "E722"]

[lint.per-file-ignores]
# PlatformIO extra scripts: SCons injects Import() and env into the namespace.
"tools/ensure_safeboot.py" = ["F821"]
"tools/ensure_tasmota_framework.py" = ["F821"]
"tools/force_include_settings_stub.py" = ["F821"]
"tools/safeboot.py" = ["F821"]
"tools/set_custom_name.py" = ["F821"]
